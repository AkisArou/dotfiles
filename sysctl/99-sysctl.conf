# See sysctl.conf(5)

# Swap is zram-first (zram0 at priority 100, /swapfile at 10), so these are
# tuned for compressed RAM-backed swap rather than disk:
#   swappiness   high, because swapping to zram is cheap compared with
#                dropping page cache
#   page-cluster 0, because swap readahead only amortises disk seeks; on zram
#                it decompresses 2^n pages to use one
vm.swappiness=100
vm.page-cluster=0

vm.vfs_cache_pressure=50
vm.dirty_ratio=10
vm.dirty_background_ratio=5

# Previously applied at runtime from @install/4-config, so they were lost on
# every reboot. Note max_user_instances silently stayed at Arch's default of
# 1024 (/usr/lib/sysctl.d/10-arch.conf) rather than the intended value.
fs.inotify.max_queued_events=16384
fs.inotify.max_user_instances=8192
fs.inotify.max_user_watches=524288
