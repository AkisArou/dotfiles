monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output[.]E4_61_F4_20_1E_BC[.].*" }
    ]
    actions = {
      update-props = { priority.session = 1500 }
    }
  }
  {
    matches = [
      { node.name = "~bluez_input[.]E4[:_]61[:_]F4[:_]20[:_]1E[:_]BC.*" }
    ]
    actions = {
      update-props = { priority.session = 3000 }
    }
  }
]
