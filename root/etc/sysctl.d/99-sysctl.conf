# Recover TCP connections when broken MTU discovery is detected.
net.ipv4.tcp_mtu_probing=1

# Balance reclaim of application memory and filesystem cache.
# Our swap priorities send pages to zram before the disk swapfile.
vm.swappiness=100

# Disable swap readahead, avoiding speculative zram decompression.
vm.page-cluster=0

# Retain directory/inode caches longer for repeated source-tree access.
vm.vfs_cache_pressure=50

# Reclaim memory earlier in the background to absorb allocation bursts.
vm.watermark_scale_factor=125

# Start background writeback around 64 MiB of dirty file data.
vm.dirty_background_bytes=67108864

# Throttle writers around 256 MiB, limiting accumulated writeback.
vm.dirty_bytes=268435456

# Keep the default five-second periodic check for old dirty data.
vm.dirty_writeback_centisecs=500

# Maximum queued filesystem events per inotify instance.
fs.inotify.max_queued_events=16384

# Allow many independent watchers across editors and development tools.
fs.inotify.max_user_instances=8192

# Allow watching large source trees; retain our current watch limit.
fs.inotify.max_user_watches=524288
