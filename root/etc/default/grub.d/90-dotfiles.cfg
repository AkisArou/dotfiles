# Preserve unrelated kernel arguments while replacing the settings managed here.
dotfiles_grub_args=
for dotfiles_grub_arg in ${GRUB_CMDLINE_LINUX_DEFAULT:-}; do
  case "$dotfiles_grub_arg" in
    mitigations=*|transparent_hugepage=*|nowatchdog|zswap.enabled=*) ;;
    *) dotfiles_grub_args="${dotfiles_grub_args:+$dotfiles_grub_args }$dotfiles_grub_arg" ;;
  esac
done
GRUB_CMDLINE_LINUX_DEFAULT="${dotfiles_grub_args:+$dotfiles_grub_args }mitigations=off transparent_hugepage=madvise nowatchdog zswap.enabled=0"
GRUB_GFXPAYLOAD_LINUX=keep
unset dotfiles_grub_args dotfiles_grub_arg
