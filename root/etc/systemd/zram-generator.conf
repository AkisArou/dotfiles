# Consumed by zram-generator(8) as /etc/systemd/zram-generator.conf.
#
# This file, not archinstall, is the source of truth for zram: the package is
# installed from @install/1-install-base so the setup works on machines that
# were not built with archinstall. zram-generator is a systemd generator, so
# no unit needs enabling -- it synthesises dev-zram0.swap on each boot.
#
# Without zram-size the generator defaults to min(ram / 2, 4096), capping at
# 4G. swap-priority is stated explicitly rather than relying on its default of
# 100; it must stay above the /swapfile priority (10) so zram absorbs pages
# first and only overflows to disk.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
