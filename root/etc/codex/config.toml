# Shared defaults, loaded through /etc/codex/config.toml.
# Codex keeps local overrides and remembered state in ~/.codex/config.toml.

approvals_reviewer = "user"
approval_policy = "never"
sandbox_mode = "danger-full-access"
model = "gpt-6.1-sol"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"

[tui]
theme = "vscode"
# tmux converts the status component to a leading icon.
terminal_title = ["spinner", "thread", "status"]

# Keep each tmux pane associated with its exact conversation for Resurrect.
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = '/usr/bin/python3 "$HOME/.config/tmux/agent-sessions.py" codex-hook'
timeout = 2

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '/usr/bin/python3 "$HOME/.config/tmux/agent-sessions.py" codex-hook'
timeout = 2

[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = '/usr/bin/python3 "$HOME/.config/tmux/agent-sessions.py" codex-hook'
timeout = 2

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest", "--browser-url=http://127.0.0.1:9222"]

[mcp_servers.react-aria]
command = "npx"
args = ["@react-aria/mcp@latest"]

[mcp_servers.huly]
command = "npx"
args = ["-y", "@firfi/huly-mcp@latest"]
env_vars = ["HULY_URL", "HULY_TOKEN", "HULY_WORKSPACE"]

[mcp_servers.huly.env]
# Trust the internal Huly CA already installed in the system certificate store.
NODE_USE_SYSTEM_CA = "1"

[mcp_servers.expo]
url = "https://mcp.expo.dev/mcp"

