# Colours, light or dark: ~/.local/bin/theme links theme.toml to theme-light.toml
# or theme-dark.toml; alacritty reloads it.
[general]
import = ["~/.config/alacritty/theme.toml"]

[window]
opacity = 1

[window.padding]
x = 20
y = 5

[font]
size = 10

[font.normal]
family = "HasklugNerdFont"
style = "Regular"

[font.bold]
family = "HasklugNerdFont"
style = "Bold"

[font.bold_italic]
family = "HasklugNerdFont"
style = "Bold Italic"

[font.italic]
family = "HasklugNerdFont"
style = "Italic"
