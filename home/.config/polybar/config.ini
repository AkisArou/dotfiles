; Linked by ~/.local/bin/theme and bootstrapped by init.
include-file = ~/.config/polybar/theme.ini

[bar/default]
monitor = ${env:MONITOR:}
width = 100%
height = ${env:POLY_BAR_HEIGHT:}
radius = 0
scroll-up = "#i3.prev"
scroll-down = "#i3.next"
background = ${colors.background}
foreground = ${colors.foreground}
bottom = false
border-color = #00000000
border = false
padding-left = 0
padding-right = 1
module-margin = 1
separator = 
separator-foreground = ${colors.disabled}
font-0 = ${env:POLY_FONT:}
modules-left = i3 scratchpad xwindow
modules-right = pulseaudio memory cpu battery backlight system-bluetooth-bluetoothctl xkeyboard date wlan eth systemd-failed-units
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true


[module/i3]
type = internal/i3
format = <label-state> <label-mode>
label-focused = %index%
label-focused-padding = 1
label-focused-foreground = ${colors.foreground-focused}
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-unfocused = %index%
label-unfocused-padding = 1
label-unfocused-underline = ${colors.primary}
label-visible = %index%
label-visible-padding = 1
label-visible-background = ${colors.background-alt}
label-visible-underline = ${colors.primary}
label-urgent = %index%
label-urgent-padding = 1
label-urgent-background = ${colors.urgent-background}
label-urgent-foreground = ${colors.urgent-foreground}


[module/scratchpad]
type = custom/script
exec = python3 ~/.config/polybar/modules/status.py scratchpad
interval = 2


[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt


[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1


[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
format-foreground = ${colors.foreground-dimmed}


[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}


[module/pulseaudio]
; The built-in module hardcodes left-click to mute and has no source indicator.
type = custom/script
exec = python3 ~/.config/polybar/modules/status.py audio --watch
tail = true
format-foreground = ${colors.foreground-subtle}
click-left = pavucontrol
click-right = pavucontrol
click-middle = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +1%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -1%


[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.foreground}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}


[module/memory]
type = internal/memory
interval = 2
format-prefix = "MEM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%


[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%


[module/battery]
; Two thresholds and a flashing background, matching Waybar's battery states.
type = custom/script
exec = python3 ~/.config/polybar/modules/status.py battery --watch
tail = true

[module/backlight]
type = internal/backlight
format-prefix = "BRT "
format-prefix-foreground = ${colors.primary}
label = %percentage%%


[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#9ece6a}%ifname%%{F#707880} disconnected


[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = ""
label-disconnected = not connected
label-disconnected-foreground = ${colors.alert}


[module/eth]
inherit = network-base
interface-type = wired
label-connected = ""
label-disconnected = not connected
label-disconnected-foreground = ${colors.alert}


[module/date]
type = internal/date
interval = 1
date = %A, %d/%m %H:%M
date-alt = %H:%M
label = %date%
format-foreground = ${colors.foreground}


[module/system-bluetooth-bluetoothctl]
type = custom/script
exec = python3 ~/.config/polybar/modules/status.py bluetooth
interval = 5
format-foreground = ${colors.foreground-subtle}


[module/systemd-failed-units]
type = custom/script
exec = python3 ~/.config/polybar/modules/status.py systemd-failed
interval = 30
format-foreground = ${colors.alert}


[module/tray]
type = internal/tray
format-margin = 8px
tray-spacing = 8px
tray-size = 73%


[settings]
screenchange-reload = true
pseudo-transparency = true
