tmux:
  symbols:
    branch: ''
    hashprefix: '@'
    ahead: '⇡'
    behind: '⇣'
    staged: '+'
    conflict: '~'
    modified: '!'
    untracked: '?'
    stashed: '*'
    clean: ''
  # tmux's theme colours (.tmux.conf), so they follow the terminal's theme.
  styles:
    clear: '#[fg=default,nobold]'
    state: '#[fg=themered,nobold]'
    branch: '#[fg=themedarkgrey,nobold]'
    remote: '#[fg=themedarkgrey,nobold]'
    divergence: '#[fg=themedarkgrey,nobold]'
    staged: '#[fg=themeyellow,nobold]'
    conflict: '#[fg=themered,nobold]'
    modified: '#[fg=themeyellow,nobold]'
    untracked: '#[fg=themeblue,nobold]'
    stashed: '#[fg=themedarkgrey,nobold]'
    clean: '#[fg=themedarkgrey,nobold]'
    insertions: '#[fg=themeyellow,nobold]'
    deletions: '#[fg=themered,nobold]'
  layout: [branch, divergence, flags]
  options:
    branch_max_len: 32
    branch_trim: center
    ellipsis: '…'
    hide_clean: true
    divergence_space: true
