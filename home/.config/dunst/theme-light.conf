# dunst in the light theme, through dunstrc.d/theme.conf.

[urgency_low]
    background = "#F3F3F3"
    foreground = "#3B3B3B"
    frame_color = "#D4D4D4"

[urgency_normal]
    background = "#F3F3F3"
    foreground = "#3B3B3B"
    frame_color = "#D4D4D4"

[urgency_critical]
    background = "#F3F3F3"
    foreground = "#3B3B3B"
    frame_color = "#D4D4D4"
