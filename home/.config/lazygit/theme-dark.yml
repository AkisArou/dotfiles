# lazygit in the dark theme; LG_CONFIG_FILE adds theme.yml to config.yml.
gui:
  theme:
    # Borders
    activeBorderColor:
      - "#569CD6"
      - "bold"
    inactiveBorderColor:
      - "#444444"
    searchingActiveBorderColor:
      - "#C586C0"
      - "bold"
    # Text / selections
    optionsTextColor:
      - "#569CD6"
    defaultFgColor:
      - "#D4D4D4"
    selectedLineBgColor:
      - "#264F78"
    # Git states
    unstagedChangesColor:
      - "#e2c08d"
    cherryPickedCommitFgColor:
      - "#D4D4D4"
    cherryPickedCommitBgColor:
      - "#C586C0"
    markedBaseCommitFgColor:
      - "#121314"
    markedBaseCommitBgColor:
      - "#C48081"
