<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- The console has its own dark and light modes: Dark Reader leaves it as it is. -->
    <meta name="darkreader-lock" />
    <meta name="theme-color" content="#1b1b1b" />
    <meta name="apple-mobile-web-app-title" content="Signalbox" />
    <!-- A home-screen app. Its status bar is solid, in the header's colour (theme-color,
         kept in step with the appearance): content drawn under a translucent one is
         blurred by iOS and measures the viewport short. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>nts · Signalbox</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
