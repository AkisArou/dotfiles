# kitty switches between dark-theme.auto.conf and light-theme.auto.conf with the
# desktop's colour scheme; the dark one is also the default.
include dark-theme.auto.conf

font_family Hasklug Nerd Font Mono
font_size 10.0
bold_font auto
italic_font auto
bold_italic_font auto
window_padding_width 0 13 10

confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 10000

scrollback_pager nvim -c "lua require('custom.kitty')" 
