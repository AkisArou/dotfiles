<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>New Tab</title>
    <style>
      html,
      body {
        background-color: #111;
        color: #a9b1d6;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      /* Brave reports the desktop's colour scheme (~/.local/bin/theme). */
      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: #fff;
          color: #3b3b3b;
        }
      }
    </style>
  </head>
  <body></body>
</html>
