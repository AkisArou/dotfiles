dotfiles_native_flags() {
  local flag
  local -a flags
  read -ra flags <<< "$1"
  for flag in "${flags[@]}"; do
    case "$flag" in
      -march=*|-mtune=*) ;;
      *) printf '%s ' "$flag" ;;
    esac
  done
  printf '%s' '-march=native'
}

CFLAGS="$(dotfiles_native_flags "$CFLAGS")"
CXXFLAGS="$(dotfiles_native_flags "$CXXFLAGS")"
RUSTFLAGS="-C force-frame-pointers=yes -C target-cpu=native"
unset -f dotfiles_native_flags
