if [ "$(cat /sys/class/dmi/id/product_name 2>/dev/null)" = "ASUS EXPERTBOOK P5405CSA" ]; then
  dotfiles_grub_args=
  for dotfiles_grub_arg in ${GRUB_CMDLINE_LINUX_DEFAULT:-}; do
    case "$dotfiles_grub_arg" in
      asus_wmi.fnlock_default=*) ;;
      *) dotfiles_grub_args="${dotfiles_grub_args:+$dotfiles_grub_args }$dotfiles_grub_arg" ;;
    esac
  done
  GRUB_CMDLINE_LINUX_DEFAULT="${dotfiles_grub_args:+$dotfiles_grub_args }asus_wmi.fnlock_default=0"
  GRUB_GFXMODE=1920x1080
  unset dotfiles_grub_args dotfiles_grub_arg
fi
