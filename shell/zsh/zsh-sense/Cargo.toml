[workspace]
members = [
  "crates/sense-adapter-api",
  "crates/sense-cli",
  "crates/sense-config",
  "crates/sense-daemon",
  "crates/sense-model",
  "crates/sense-provider-api",
  "crates/sense-protocol",
  "crates/sense-rank",
  "crates/sense-zsh-worker",
  "crates/sense-zsh-sys",
  "crates/sense-zsh-abi",
  "crates/sense-zsh-module",
]
default-members = ["crates/sense-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
bitflags = { version = "2.13.1", features = ["serde"] }
blake3 = "1.8.5"
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive"] }
etcetera = "0.11.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
frizbee = { version = "=0.11.0", default-features = false, features = [
  "safe_read",
] }
futures-util = { version = "0.3.33", features = ["sink"] }
indexmap = { version = "2.14.0", features = ["serde"] }
rmp-serde = "1.3.1"
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
semver = { version = "1.0.27", features = ["serde"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
  "io-std",
  "io-util",
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-width = "0.2.2"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
