# zsh-sense configuration reference. Every field shown here is validated.
version = 1
profile = "default"

[activation]
mode = "continuous"
debounce_ms = 15
max_debounce_ms = 75
min_query_chars = 1
trigger_on_empty = ["options", "paths", "subcommands"]
events = [
  "insert",
  "backspace",
  "delete",
  "word-delete",
  "paste",
  "history",
  "cursor",
  "accept",
]
characters = ["/", "-", "=", ":", " "]
immediate_characters = ["/", "-", "="]
after_accept = true

[keybindings.closed]
tab = "trigger"
"ctrl-space" = "trigger"
enter = "execute"

[keybindings.popup]
tab = "accept"
"ctrl-e" = "accept"
enter = "execute"
"ctrl-n" = "next"
"ctrl-p" = "previous"
"ctrl-d" = "page-down"
"ctrl-u" = "page-up"
escape = "dismiss"
right = "accept-next-token"
end = "accept-ghost"

[keybindings.snippet]
tab = "next-placeholder"
"shift-tab" = "previous-placeholder"
escape = "cancel-snippet"

[matching]
engine = "frizbee"
case = "smart"
typos = "adaptive"
max_typos = 2
typo_min_query_chars = 4
max_results = 1000
preserve_groups = true
use_frecency = true
use_project_proximity = true
explain_scores = false

[popup]
enabled = true
decorations = "full"
border = "none"
title = false
footer = true
scrollbar = true
scrollbar_character = "▐"
group_headings = true
descriptions = true
max_rows = 10
# Width follows the complete ranked result set within these bounds. Use the
# same value for min_width and max_width to request a fixed-width popup.
max_width = 140
min_width = 24
padding = 1

[indicators]
kinds = "icon"
icon_theme = "nerd-font"
file_icons = "devicons"
selected_marker = ""

[documentation]
mode = "auto"
resolve_delay_ms = 80
side_min_columns = 100
width_ratio = 0.45
max_rows = 14
render_markdown = true
sources = ["completion", "schema", "man", "adapter", "help"]

[ghost_text]
enabled = true
source = "best"
minimum_confidence = 0.82
at_end_only = true
partial_accept = "token"

[sources.zsh]
enabled = true
priority = 100
soft_timeout_ms = 100
hard_timeout_ms = 1000
max_candidates = 100000
candidate_filter = "subsequence"
fuzzy_min_query_chars = 3

[sources.filesystem]
enabled = true
priority = 80
soft_timeout_ms = 20
hard_timeout_ms = 100
max_candidates = 100000
respect_hidden_prefix = true

[sources.history]
enabled = true
priority = 40
soft_timeout_ms = 20
hard_timeout_ms = 100
max_candidates = 100000

[sources.snippets]
enabled = true
priority = 35
soft_timeout_ms = 20
hard_timeout_ms = 100
max_candidates = 100000

[adapters]
enabled = true
allow_external = true
manifest_paths = ["~/.config/zsh-sense/adapters/*.json"]
trusted_adapters = []
default_soft_timeout_ms = 80
default_hard_timeout_ms = 500
maximum_concurrency = 4

[adapters.git]
enabled = true
preview = true

[adapters.systemd]
enabled = true
preview = true

[snippets]
enabled = true
format = "vscode"
paths = ["~/.config/zsh-sense/snippets/*.code-snippets"]
project_snippets = "trusted-only"
linked_placeholders = true
choices = true
transforms = true
sort = "inline"

[history]
enabled = true
incognito = false
database = "~/.local/state/zsh-sense/history.sqlite3"
learn_only_successful = true
maximum_age_days = 365
sensitive_patterns = ["*password*", "*token*", "*secret*", "*Authorization:*"]

[diagnostics]
enabled = true
minimum_confidence = "authoritative"
show_in_popup = true
underline_buffer = true

[safety]
enabled = true
confirmation = "critical-only"
ai_may_block_execution = false

[cache]
memory_mib = 128
candidate_ttl_seconds = 30
documentation_ttl_seconds = 3600
persist_warm_metadata = true

[native]
mode = "auto"
portable_fallback = true
auto_rebuild = true
allow_signed_prebuilt = true

[logging]
level = "warn"
file = "~/.local/state/zsh-sense/zsh-sense.log"
include_command_lines = false

[styles]
# Resolved from this dotfiles repository's vscode.nvim BlinkCmp highlights.
# Component styles inherit unspecified attributes from menu; selected is
# background-only so label, fuzzy-match, and kind foregrounds remain visible.
menu = "fg=#bbbbbb,bg=#202020"
border = "fg=#d4d4d4"
selected = "bg=#343b41"
label = "fg=#d4d4d4"
label_match = "fg=#18a2fe,bold"
detail = "fg=#bbbbbb"
kind = "fg=#bbbbbb"
group = "fg=#4ec9b0"
footer = "fg=#bbbbbb"
scrollbar_thumb = "fg=#bbbbbb"
scrollbar_gutter = "fg=#343b41"
diagnostic_error = "fg=#f14c4c,underline"
diagnostic_warning = "fg=#cca700,underline"
ghost = "fg=#707070"

[styles.kinds]
text = "fg=#bbbbbb"
command = "fg=#c586c0"
alias = "fg=#c586c0"
builtin = "fg=#c586c0"
function = "fg=#c586c0"
subcommand = "fg=#c586c0"
option = "fg=#ffd602"
option-value = "fg=#9cdcfe"
variable = "fg=#9cdcfe"
file = "fg=#d4d4d4"
directory = "fg=#569cd6"
symlink = "fg=#d4d4d4"
snippet = "fg=#ffd602"
action = "fg=#ffd602"

[[rules]]
name = "manual completion for sensitive tools"

[rules.match]
commands = ["gpg", "pass", "passwd"]

[rules.activation]
mode = "manual"

[rules.history]
enabled = false

[[rules]]
name = "minimal remote UI"

[rules.match]
environment = { SSH_CONNECTION = "*" }

[rules.popup]
decorations = "minimal"
max_rows = 6

[rules.indicators]
kinds = "text"
file_icons = "none"
