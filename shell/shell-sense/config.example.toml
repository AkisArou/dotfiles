# shell-sense configuration reference. Every field shown here is validated.
version = 4
profile = "default"

[activation]
mode = "continuous"
debounce_ms = 15
events = [
  "insert",
  "backspace",
  "delete",
  "word-delete",
  "paste",
  "history",
  "cursor",
  "accept",
]
characters = ["/", "-", "=", ":", " "]
immediate_characters = ["/", "-", "="]
after_accept = true

[keybindings.closed]
tab = "trigger"
"ctrl-space" = "trigger"
"ctrl-c" = "interrupt"
enter = "execute"

[keybindings.popup]
tab = "accept"
"ctrl-e" = "accept"
enter = "execute"
"ctrl-c" = "interrupt"
"ctrl-n" = "next"
"ctrl-p" = "previous"
"ctrl-d" = "page-down"
"ctrl-u" = "page-up"
"ctrl-f" = "documentation-page-down"
"ctrl-b" = "documentation-page-up"
"ctrl-g" = "toggle-documentation"
escape = "dismiss"
right = "accept-next-token"
end = "accept-ghost"

[matching]
case = "smart"
typos = "adaptive"
max_typos = 2
typo_min_query_chars = 4
max_results = 1000
preserve_groups = true

[popup]
enabled = true
decorations = "full"
border = "none"
title = false
footer = true
scrollbar = true
scrollbar_character = "▐"
group_headings = true
descriptions = true
max_rows = 10
# Keep this many candidates visible beyond the selection while navigating.
scrolloff = 2
# Wrap next/previous navigation across the end and start of the list.
cycle = true
# Width follows the complete ranked result set within these bounds. Use the
# same value for min_width and max_width to request a fixed-width popup.
max_width = 140
min_width = 24
# At least one cell is required for ZLE's stable physical-row refresh anchor.
padding = 1

[indicators]
kinds = "icon"
file_icons = "filetype"
selected_marker = ""

[documentation]
mode = "side"
# Keep the current document visible until selection settles for this long.
update_delay_ms = 80
side_min_columns = 100
width_ratio = 0.45
# Below-mode maximum. A side pane follows popup.max_rows so both surfaces
# remain aligned and useful even when the current menu has only one item.
max_rows = 14
padding = 0
scrollbar = true
render_markdown = true

[ghost_text]
enabled = true
minimum_confidence = 0.82
partial_accept = "token"

[sources.zsh]
max_candidates = 100000
candidate_filter = "subsequence"
fuzzy_min_query_chars = 3

[sources.fish]
max_candidates = 100000
fuzzy_min_query_chars = 3

[sources.bash]
max_candidates = 100000
fuzzy_min_query_chars = 3

[adapters]
enabled = true
default_soft_timeout_ms = 80
default_hard_timeout_ms = 500
maximum_concurrency = 4

[adapters.documentation]
enabled = true

[[adapters.documentation.resolvers]]
name = "file-information"
kinds = ["file", "symlink"]
command = ["file", "--brief", "--", "$value"]

[[adapters.documentation.resolvers]]
name = "directory-listing"
kinds = ["directory"]
command = ["ls", "-la", "--", "$value"]

[adapters.git]
enabled = true

[adapters.man]
enabled = true

[adapters.systemd]
enabled = true

[cache]
memory_mib = 128
documentation_ttl_seconds = 3600

[logging]
level = "warn"

[styles]
# Resolved from this dotfiles repository's vscode.nvim BlinkCmp highlights.
# Component styles inherit unspecified attributes from menu; selected is
# background-only so label, fuzzy-match, and kind foregrounds remain visible.
menu = "fg=#bbbbbb,bg=#202020"
border = "fg=#d4d4d4"
selected = "bg=#343b41"
label = "fg=#d4d4d4"
label_match = "fg=#18a2fe,bold"
detail = "fg=#bbbbbb"
kind = "fg=#bbbbbb"
group = "fg=#4ec9b0"
footer = "fg=#bbbbbb"
scrollbar_thumb = "fg=#bbbbbb"
scrollbar_gutter = "fg=#343b41"
ghost = "fg=#707070"
documentation = "fg=#d4d4d4,bg=#202020"
documentation_border = "fg=#d4d4d4"
documentation_heading = "fg=#18a2fe,bold"
documentation_code = "fg=#ce9178"
documentation_quote = "fg=#808080"

[styles.kinds]
text = "fg=#bbbbbb"
command = "fg=#c586c0"
alias = "fg=#c586c0"
builtin = "fg=#c586c0"
function = "fg=#c586c0"
subcommand = "fg=#c586c0"
option = "fg=#ffd602"
option-value = "fg=#9cdcfe"
variable = "fg=#9cdcfe"
file = "fg=#d4d4d4"
directory = "fg=#569cd6"
symlink = "fg=#d4d4d4"
